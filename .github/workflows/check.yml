name: Check the menu

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the guide
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified 2026-09-29
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified 2026-09-29
        with:
          python-version: "3.11"
      - name: Validate the catalog and local links
        run: python3 tools/check.py
      - name: Test the offline picker
        run: python3 -m unittest discover -s tests -v
      - name: Smoke-test an empty result and a free suggestion
        run: |
          python3 tools/pick.py --minutes 0 --budget 0
          python3 tools/pick.py --minutes 20 --budget 0 --company solo --seed 42
