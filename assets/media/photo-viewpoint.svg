<svg xmlns="http://www.w3.org/2000/svg" width="440" height="854" viewBox="0 0 440 854" role="img" aria-labelledby="title desc">
<title id="title">放大，不等于走近</title>
<desc id="desc">两块等高板的原创中心投影模型。视点不变时裁剪放大，B与A的像高比仍为二分之一；由距离2和4米后退至8和10米，再放大到A相同大小，比例变为五分之四。不是实拍照片或完整场景。</desc>
<rect width="440" height="854" rx="16" fill="#fff8ec"/>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#24231f">
<text x="24" y="40" font-size="27" font-weight="700">放大，不等于走近</text>
<text x="24" y="74" font-size="19">同高的两块板，只比较投影像高</text>
<rect x="20" y="96" width="400" height="204" rx="12" fill="#eee7db"/>
<text x="34" y="127" font-size="22" font-weight="700">① 初始视点：距 A 2米 / B 4米</text>
<rect id="near-a" data-height="100" x="78" y="150" width="58" height="100" fill="#23798a"/>
<rect id="near-b" data-height="50" x="196" y="200" width="58" height="50" fill="#ad583a"/>
<text x="278" y="190" font-size="23">B / A</text><text x="278" y="225" font-size="27" font-weight="700">1 / 2</text>
<text x="78" y="280" font-size="20">A 100</text><text x="192" y="280" font-size="20">B 50</text>
<rect x="20" y="316" width="400" height="240" rx="12" fill="#eee7db"/>
<text x="34" y="349" font-size="22" font-weight="700">② 同一视点：共同放大 1.5倍</text>
<rect id="crop-a" data-height="150" x="78" y="371" width="58" height="150" fill="#23798a"/>
<rect id="crop-b" data-height="75" x="196" y="446" width="58" height="75" fill="#ad583a"/>
<text x="278" y="432" font-size="23">B / A</text><text x="278" y="467" font-size="27" font-weight="700">1 / 2</text>
<text x="78" y="546" font-size="20">A 150</text><text x="192" y="546" font-size="20">B 75</text>
<rect x="20" y="572" width="400" height="240" rx="12" fill="#eee7db"/>
<text x="34" y="605" font-size="22" font-weight="700">③ 后退：距 A 8米 / B 10米</text>
<rect id="far-a" data-height="150" x="78" y="627" width="58" height="150" fill="#23798a"/>
<rect id="far-b" data-height="120" x="196" y="657" width="58" height="120" fill="#ad583a"/>
<text x="278" y="682" font-size="23">B / A</text><text x="278" y="717" font-size="27" font-weight="700">4 / 5</text>
<text x="78" y="802" font-size="20">A 150</text><text x="192" y="802" font-size="20">B 120</text>
<text x="24" y="838" font-size="17">③ 重新放大至 A 同样大；非完整场景图</text>
</g></svg>
