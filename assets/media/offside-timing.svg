<svg xmlns="http://www.w3.org/2000/svg" width="440" height="960" viewBox="0 0 440 960" role="img" aria-labelledby="title desc">
  <title id="title">越位先看队友传球时，不是接球时</title>
  <desc id="desc">三个抽象位置图，进攻方向向右。第一图传球时接应者位于倒数第二名对手之前；第二图同一接应者接球时已经越过此对手，但不能据第二图倒推越位。第三图为另一次传球，接应者在对方半场且比球和倒数第二名对手都更靠近球门线，只确定越位位置，还需判断参与比赛条件。不是实际比赛判罚图。</desc>
  <rect width="440" height="960" rx="16" fill="#fff8ec"/>
  <g font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#24231f">
    <text x="24" y="38" font-size="26" font-weight="700">先看传球时，不是接球时</text>
    <text x="24" y="72">本书原创位置示意 · 进攻方向 →</text>
    <circle cx="35" cy="107" r="9" fill="#ba4529"/>
    <text x="53" y="114">进攻者</text>
    <rect x="164" y="98" width="18" height="18" fill="#276675"/>
    <text x="193" y="114">对手</text>
    <circle cx="288" cy="107" r="6" fill="#24231f"/>
    <text x="306" y="114">球</text>
    <g fill="#fffdf8" stroke="#d7d1c4">
      <rect x="12" y="134" width="416" height="232" rx="10"/>
      <rect x="12" y="384" width="416" height="232" rx="10"/>
      <rect x="12" y="634" width="416" height="252" rx="10"/>
    </g>
    <g stroke="#b7b3a4" stroke-width="2">
      <path d="M24 234H416 M24 484H416 M24 734H416"/>
      <path d="M220 218V266 M220 468V516 M220 718V766" stroke-dasharray="5 4"/>
      <path d="M416 218V266 M416 468V516 M416 718V766"/>
    </g>
    <g fill="#626057">
      <text x="198" y="289">中线</text><text x="416" y="289" text-anchor="end">对方球门线</text>
      <text x="198" y="539">中线</text><text x="416" y="539" text-anchor="end">对方球门线</text>
      <text x="198" y="789">中线</text><text x="416" y="789" text-anchor="end">对方球门线</text>
    </g>
    <g font-size="24" font-weight="700">
      <text x="26" y="166">甲：队友传球的时刻</text>
      <text x="26" y="416">乙：同一球，接球的时刻</text>
      <text x="26" y="666">丙：另一次传球的时刻</text>
    </g>
    <g fill="#ba4529">
      <circle cx="165" cy="234" r="10"/><circle cx="255" cy="234" r="10"/>
      <circle cx="165" cy="484" r="10"/><circle cx="339" cy="484" r="10"/>
      <circle cx="165" cy="734" r="10"/><circle cx="339" cy="734" r="10"/>
    </g>
    <g fill="#276675">
      <rect x="294" y="225" width="18" height="18"/><rect x="380" y="225" width="18" height="18"/>
      <rect x="294" y="475" width="18" height="18"/><rect x="380" y="475" width="18" height="18"/>
      <rect x="294" y="725" width="18" height="18"/><rect x="380" y="725" width="18" height="18"/>
    </g>
    <g fill="#24231f">
      <circle cx="184" cy="234" r="5"/><circle cx="358" cy="484" r="5"/><circle cx="184" cy="734" r="5"/>
    </g>
    <g text-anchor="middle">
      <text x="165" y="212">传球者</text><text x="255" y="212">接应者</text>
      <text x="303" y="265">倒数第二</text><text x="389" y="265">最后</text>
      <text x="339" y="462">接应者</text>
      <text x="303" y="515">倒数第二</text><text x="389" y="515">最后</text>
      <text x="165" y="712">传球者</text><text x="339" y="712">接应者</text>
      <text x="303" y="765">倒数第二</text><text x="389" y="765">最后</text>
    </g>
    <g fill="#276675">
      <text x="26" y="324">接应者还没越过这名对手：</text>
      <text x="26" y="352" font-weight="700">不是越位位置。</text>
      <text x="26" y="574">接球时跑到前面，不能反过来</text>
      <text x="26" y="602" font-weight="700">改变甲图的判断时点。</text>
    </g>
    <g fill="#9b3e26">
      <text x="26" y="824">在对方半场，比球与倒数第二名</text>
      <text x="26" y="852">对手都靠前：这是越位位置。</text>
      <text x="26" y="878" font-weight="700">但不等于已经构成越位犯规。</text>
    </g>
    <text x="24" y="919" fill="#626057">图点表示位置，其余队员省略。</text>
    <text x="24" y="949" fill="#626057">非真实比赛、非比例、非判罚图。</text>
  </g>
</svg>
