<text x="42" y="890" font-size="31">丙</text>
<g data-panel="canon" data-row="2" data-slot="1" data-value="."><rect x="87" y="835" width="110" height="86" fill="#fff8ed" stroke="#a39580" stroke-width="1.5"/><text x="142" y="891" text-anchor="middle" font-size="38" font-weight="700">·</text></g>
