<text x="40" y="967" font-size="27">第3格：甲是 R，乙是 Q，丙是 P</text>
<text x="40" y="1022" font-size="27">· 仅表示未做这段材料，不规定姿势</text>
<text x="40" y="1060" font-size="25">原创关系图；不是动作教程，也不是作品舞谱</text>
