<svg xmlns="http://www.w3.org/2000/svg" width="440" height="510" viewBox="0 0 440 510" role="img" aria-labelledby="title desc">
<title id="title">四个地点，六条路</title>
<desc id="desc">A在上方，B在左下，C在右下，D在三角形内部。道路AB、AC、BC、AD、BD、CD；没有其他交点或道路。每条路恰好走一次，地点可重复，不要求回到起点。</desc>
<rect width="440" height="510" rx="16" fill="#fff8ec"/>
<g font-family="PingFang SC, Microsoft YaHei, sans-serif" fill="#24231f">
<text x="24" y="42" font-size="26" font-weight="700">四个地点，六条路</text>
<text x="24" y="78" font-size="20">每条路一次，地点可重复</text>
<line data-road="AB" x1="220" y1="132" x2="82" y2="390" stroke="#686158" stroke-width="5"/>
<line data-road="AC" x1="220" y1="132" x2="358" y2="390" stroke="#686158" stroke-width="5"/>
<line data-road="BC" x1="82" y1="390" x2="358" y2="390" stroke="#686158" stroke-width="5"/>
<line data-road="AD" x1="220" y1="132" x2="220" y2="292" stroke="#686158" stroke-width="5"/>
<line data-road="BD" x1="82" y1="390" x2="220" y2="292" stroke="#686158" stroke-width="5"/>
<line data-road="CD" x1="358" y1="390" x2="220" y2="292" stroke="#686158" stroke-width="5"/>
<circle cx="220" cy="132" r="23" fill="#fff8ec" stroke="#b93a20" stroke-width="3"/>
<text x="220" y="140" font-size="25" text-anchor="middle" font-weight="700">A</text>
<circle cx="82" cy="390" r="23" fill="#fff8ec" stroke="#b93a20" stroke-width="3"/>
<text x="82" y="398" font-size="25" text-anchor="middle" font-weight="700">B</text>
<circle cx="358" cy="390" r="23" fill="#fff8ec" stroke="#b93a20" stroke-width="3"/>
<text x="358" y="398" font-size="25" text-anchor="middle" font-weight="700">C</text>
<circle cx="220" cy="292" r="23" fill="#fff8ec" stroke="#b93a20" stroke-width="3"/>
<text x="220" y="300" font-size="25" text-anchor="middle" font-weight="700">D</text>
<text x="24" y="453" font-size="20">任选起点，可以不同地点结束</text>
<text x="24" y="483" font-size="18">原创抽象图 · 线长不表示距离</text>
</g></svg>
