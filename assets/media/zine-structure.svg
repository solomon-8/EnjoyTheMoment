<text x="119.5" y="640" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#24231f">4 · 内页</text>
<rect id="reading-page-5" x="225" y="606" width="191" height="52" rx="6" fill="#e1eeee" stroke="#b9b2a4"/>
<text x="320.5" y="640" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" fill="#24231f">5 · 内页</text>
